[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research-assistant"
version = "0.1.0"
description = "A small, explainable multi-agent pipeline for evidence-based research reports"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
research-agents = "research_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
